version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: tradebot
      POSTGRES_PASSWORD: botpassword
      POSTGRES_DB: tradebotdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    environment:
      - DB_USER=tradebot
      - DB_PASS=botpassword
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=tradebotdb
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN} # Expected to be provided via .env
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
